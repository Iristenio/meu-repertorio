name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # O endereço antigo (iristenio.github.io/meu-repertorio) publica só o aviso de mudança
      - if: github.event.repository.name == 'meu-repertorio'
        uses: actions/upload-pages-artifact@v3
        with:
          path: aviso-mudanca
      - if: github.event.repository.name != 'meu-repertorio'
        run: npm ci
      - if: github.event.repository.name != 'meu-repertorio'
        run: npm test --if-present -- --passWithNoTests
      - if: github.event.repository.name != 'meu-repertorio'
        run: npm run build
        env:
          # Repositório "<nome>.github.io" publica na raiz do endereço; os outros, em /<repositório>/
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
      - if: github.event.repository.name != 'meu-repertorio'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
